<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LoL 战报 · 海克斯大乱斗</title>
<style>
:root{
  --bg:#0A0A0B;
  --surface:#131315;
  --line:#232326;
  --line-soft:#1A1A1D;
  --text-hi:#F2F2F3;
  --text-mid:#9E9EA4;
  --text-low:#6A6A70;
  --ghost:#3A3A3E;
  --danger:#D9534F;
  --win:#D9AE5F;
  --rail:#E9E9E6;
  --rail-2:#8A8F98;
  --gold:#D9AE5F;
  --e:cubic-bezier(.22,1,.36,1);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --sans:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#060607;font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--text-mid)}
.stage{display:flex;justify-content:center;padding:28px}
.app{width:1280px;background:var(--bg);border-radius:12px;overflow:hidden;
  box-shadow:0 40px 120px -50px #000,0 0 0 1px #17171A}

/* ── 顶栏 ── */
.topbar{height:56px;display:flex;align-items:center;padding:0 48px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:9px;height:9px;background:var(--text-hi)}
.brand b{font-size:13px;font-weight:500;color:var(--text-hi);letter-spacing:.3px}
.topbar .mid{margin-left:auto;margin-right:auto;font-size:12px;color:var(--text-low);letter-spacing:.5px}
.ghost-btn{font-size:11px;color:var(--text-low);background:transparent;border:1px solid var(--line);
  border-radius:4px;padding:3px 9px;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.5px}
.ghost-btn:hover{color:var(--text-mid);border-color:var(--ghost)}
.ghost-btn.on{color:#0A0A0B;background:var(--text-hi);border-color:var(--text-hi)}
.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-low);margin-left:16px}
.status i{width:5px;height:5px;border-radius:50%;background:var(--win)}

/* ── 头部 ── */
.head{padding:38px 48px 24px;display:flex;align-items:flex-end;justify-content:space-between}
.result{font-size:58px;font-weight:700;letter-spacing:10px;line-height:.9;color:var(--win)}
.result.lose{color:#C9D3E0}
.sub{margin-top:14px;font-size:12px;color:var(--text-low);letter-spacing:1.2px}
.sub b{color:var(--text-mid);font-weight:500;font-family:var(--mono)}
.kpis{display:flex;gap:44px;padding-bottom:6px}
.kpi{text-align:right}
.kpi .v{font-family:var(--mono);font-size:26px;color:var(--text-hi);line-height:1}
.kpi .v .s{color:var(--text-low);font-size:16px;margin:0 2px}
.kpi .l{margin-top:8px;font-size:10px;color:var(--text-low);letter-spacing:1px}
.kpi .v.pos{color:var(--win)}
.kpi .v.neg{color:var(--danger)}

/* ── 阵容 ── */
.board{padding:0 48px}
.teamlabel{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:2px;color:var(--text-low)}
.teamlabel .ln{flex:1;height:1px;background:var(--line-soft)}
.teamlabel .n{font-family:var(--mono);letter-spacing:.5px;color:var(--ghost)}
.teamlabel .lg{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.8px;color:var(--text-low)}
.teamlabel .lg i{width:11px;height:3px;border-radius:2px;display:block}
.teamlabel .lg i:not(:first-child){margin-left:9px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 0 16px}
.slot{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px 0 0;position:relative}
.slot .top{width:80px;margin:0 auto 7px;display:flex;justify-content:space-between;align-items:baseline}
.slot .idx{font-family:var(--mono);font-size:9px;color:var(--ghost);letter-spacing:1px}
.slot .sc{font-family:var(--mono);font-size:10.5px;color:var(--text-mid);letter-spacing:.5px}
.ava{position:relative;width:80px;height:80px;border-radius:9px;overflow:hidden;background:#1A1A1D;
  outline:1px solid #2A2A2E;transition:outline-color .18s var(--e),transform .18s var(--e)}
.ava img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92)}
.slot:hover .avawrap{transform:translateY(-3px)}
.slot:hover .ava{outline-color:#55555C}
.slot.sel .nm{color:#FFF}
.slot.sel .idx{color:var(--text-mid)}
.slot.sel .ava{outline-color:#8A8F98}
.slot.sel .rails{box-shadow:0 6px 0 -5px var(--text-hi)}
.slot .sc.na{color:var(--danger)}
.slot .sc.mvp{color:var(--win)}
.nm{margin-top:10px;font-size:12px;color:var(--text-hi);letter-spacing:.2px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.kd{margin-top:4px;font-family:var(--mono);font-size:10.5px;color:var(--text-mid);letter-spacing:.4px}
.kd .d.hot{color:var(--danger)}
.rails{margin-top:8px;width:84px;display:flex;flex-direction:column;gap:3px}
.rails i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.075);position:relative;overflow:hidden}
.rails i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);border-radius:2px;background:var(--c,var(--rail))}

/* ── 时间轴 ── */
.axis{position:relative;height:96px;margin:2px 0}
.axis .line{position:absolute;left:0;right:0;top:46px;height:1px;background:var(--line)}
.axis .tick{position:absolute;top:46px;width:1px;height:6px;background:var(--ghost)}
.ep{position:absolute;width:2px;height:15px;bottom:50px;background:var(--text-low);border-radius:1px}
.ep.mine{background:var(--danger)}
.ep.foe{background:#5A6068;bottom:auto;top:50px}
.ep .lb{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);font-family:var(--mono);
  font-size:8.5px;color:var(--text-low);white-space:nowrap}
.ep.foe .lb{bottom:auto;top:17px;color:#6E757E}
.ep.mine .lb{color:var(--danger);opacity:.9}
.ob{position:absolute;top:53px;transform:translateX(-50%);width:9px;height:9px;border:1px solid var(--text-low)}
.ob.inhib{transform:translateX(-50%) rotate(45deg);border-color:var(--win)}
.ob.ace{border-radius:50%;border-color:var(--text-mid);background:rgba(255,255,255,.12)}


/* ── 结论：双方各一组 ── */
.verdicts{padding:0 48px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  margin-top:10px}
.vhead{padding:18px 0 0;font-size:9.5px;letter-spacing:1.8px;color:var(--text-low);
  display:flex;align-items:baseline;justify-content:space-between}
.vhead i{font-style:normal;color:var(--ghost);letter-spacing:.6px}
.vgroup{padding:14px 0 20px}
.vgroup + .vgroup{border-top:1px solid #16161A}
.vlabel{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:2.2px;color:var(--text-low)}
.vlabel .side{color:var(--text-mid);min-width:24px}
.vlabel .ln{flex:1;height:1px;background:var(--line-soft)}
.vlabel .sum{font-family:var(--mono);letter-spacing:.3px;color:var(--ghost)}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px}
.vd{padding-right:28px}
.vd + .vd{padding-left:28px;border-left:1px solid #17171A}
.vd:last-child{padding-right:0}
.vd .t{font-size:10px;letter-spacing:2.4px;color:var(--text-low)}
.vd .t i{font-style:normal;font-size:9.5px;letter-spacing:.4px;color:var(--ghost);margin-left:7px}
.vd .n{margin-top:13px;font-size:20px;color:var(--text-hi);font-weight:500;letter-spacing:.5px}
.vd .n em{font-style:normal;font-size:11.5px;color:var(--text-low);margin-left:8px;letter-spacing:0}
.vd .why{margin-top:10px;font-size:11.5px;line-height:1.75;color:var(--text-mid)}
.vd .why b{color:var(--text-hi);font-weight:500;font-family:var(--mono)}
.vd.worm .n{color:var(--danger)}
.vd.worm .t{color:#C8716A}

/* ── 蛆 · 圆形印章 ── */
.avawrap{position:relative;width:80px;height:80px;transition:transform .18s var(--e)}
.stamp{position:absolute;right:-13px;bottom:-13px;width:48px;height:48px;border-radius:50%;
  border:1.3px solid rgba(217,83,79,.95);display:grid;place-items:center;
  font-size:16px;font-weight:700;color:#E2685F;line-height:48px;letter-spacing:0;
  background:rgba(8,8,9,.62);box-shadow:inset 0 0 0 2px rgba(217,83,79,.26);
  transform:rotate(-13deg) translateY(2px);z-index:3;pointer-events:none;text-align:center}

/* ── 崩盘记录 ── */
.sect{border-bottom:1px solid var(--line-soft);padding:26px 48px 26px;display:grid;
  grid-template-columns:1fr 330px;gap:44px}
.sect h3{font-size:11px;letter-spacing:2.2px;color:var(--text-low);font-weight:400}
.sect h3 .c{color:var(--text-hi);font-family:var(--mono);margin-left:7px}
.ilist{margin-top:14px}
.ir{display:grid;grid-template-columns:52px 1fr 104px;gap:14px;align-items:baseline;height:27px;
  border-bottom:1px solid #141416;font-size:11.5px}
.ir:last-child{border-bottom:none}
.ir .tm{font-family:var(--mono);font-size:10.5px;color:var(--text-low)}
.ir .who{color:var(--text-mid);display:flex;align-items:center;gap:8px;min-width:0}
.ir .who b{color:var(--text-hi);font-weight:500;white-space:nowrap}
.ir .who>span:not(.sd){color:var(--text-low);font-size:10.5px;white-space:nowrap}
.ir .sd{font-size:9px;letter-spacing:.5px;padding:1px 4px;border:1px solid var(--line);border-radius:2px;color:var(--text-low)}
.ir .cost{font-family:var(--mono);font-size:10px;color:var(--text-low);text-align:right}
.ir.crime .who b{color:var(--danger)}
.ir.crime .cost{color:#9A6360}
.dist{position:relative;height:224px;margin-top:12px}
.dist .base{position:absolute;left:0;right:0;top:112px;height:1px;background:var(--line)}
.dist .m{position:absolute;width:2px;height:var(--h);bottom:113px;background:var(--danger);opacity:.85}
.dist .m.foe{bottom:auto;top:113px;background:#6E757E;opacity:.9}
.dist .ax{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:9px;color:var(--ghost)}
.dist .cap{position:absolute;font-size:9px;letter-spacing:1px;color:var(--text-low)}
.dist .cap.t{top:0}
.dist .cap.b{bottom:18px}

/* ── 详情 ── */
.detail{padding:26px 48px 28px}
.dhead{display:flex;align-items:center;gap:16px}
.dhead .ava{width:52px;height:52px;border-radius:8px}
.dhead .who b{font-size:16px;color:var(--text-hi);font-weight:500}
.dhead .who em{font-style:normal;font-size:11px;color:var(--text-low);margin-left:9px}
.dhead .kda{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--text-hi);letter-spacing:1px}
.dhead .kda small{color:var(--text-low);font-size:11px;margin-left:10px;letter-spacing:0}
.dbody{display:grid;grid-template-columns:1.3fr 1fr;gap:44px;margin-top:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 34px}
.st .top{display:flex;justify-content:space-between;align-items:baseline}
.st .k{font-size:10.5px;color:var(--text-low);letter-spacing:.6px}
.st .v{font-family:var(--mono);font-size:13px;color:var(--text-hi)}
.st .v small{color:var(--text-low);font-size:9.5px;margin-left:4px}
.st .bar{margin-top:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.st .bar i{display:block;height:100%;width:var(--w);border-radius:2px;background:var(--c,var(--rail))}
.right{display:flex;flex-direction:column;gap:17px}
.lbl{font-size:9.5px;letter-spacing:1.6px;color:var(--text-low)}
.augs{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.aug{display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border:1px solid var(--line);
  border-radius:5px;background:#0E0E10}
.aug img{width:22px;height:22px;border-radius:3px;display:block}
.aug span{font-size:11px;color:var(--text-mid);white-space:nowrap}
.aug.p{border-color:rgba(176,140,255,.45)}
.aug.g{border-color:rgba(217,174,95,.42)}
.aug.s{border-color:rgba(185,192,200,.28)}
.items{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.items img{width:28px;height:28px;border-radius:4px;display:block;background:#141416}
.items .emp{width:28px;height:28px;border-radius:4px;background:#101012;box-shadow:inset 0 0 0 1px #1B1B1E}
.spells{display:flex;gap:18px;margin-top:9px;font-size:11px;color:var(--text-mid)}
.spells b{font-weight:400;color:var(--text-low);margin-right:6px}

.foot{display:flex;justify-content:space-between;align-items:center;padding:0 48px 18px;
  font-size:10px;color:#3E3E43;letter-spacing:.6px}
.foot b{color:#4A4A50;font-weight:400;font-family:var(--mono)}
</style>
</head>
<body>
<div class="stage">
<div class="app">

  <div class="topbar">
    <div class="brand"><span class="mark"></span><b>战报</b></div>
    <div class="mid" id="mid"></div>
    <button class="ghost-btn" id="pretty">美颜</button>
    <div class="status"><i></i><span id="res">我方胜利</span></div>
  </div>

  <div class="head">
    <div>
      <div class="result" id="result">胜利</div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="board">
    <div class="teamlabel"><span>敌方</span><span class="n" id="foe-line"></span><span class="ln"></span>
      <span class="lg"><i style="background:var(--rail)"></i>输出<i style="background:var(--rail-2)"></i>团队<i style="background:var(--danger)"></i>风险</span></div>
    <div class="slots" id="foe-slots"></div>
    <div class="axis" id="axis">
      <div class="line"></div>

    </div>
    <div class="slots" id="mine-slots"></div>
    <div class="teamlabel"><span class="ln"></span><span class="n" id="mine-line"></span><span>我方</span></div>
  </div>

  <div class="verdicts" id="verdicts"></div>

  <div class="sect">
    <div>
      <h3><span id="indict-title">崩盘记录</span><span class="c" id="ep-count"></span></h3>
      <div class="ilist" id="ilist"></div>
    </div>
    <div>
      <h3>崩盘分布</h3>
      <div class="dist" id="dist">
        <div class="base"></div>
        <div class="cap t">我方发起</div>
        <div class="cap b">敌方发起</div>
        <div class="ax" id="dist-ax"></div>
      </div>
    </div>
  </div>

  <div class="detail">
    <div class="dhead">
      <div class="ava"><img id="d-img" alt=""></div>
      <div class="who"><b id="d-name"></b><em id="d-champ"></em></div>
      <div class="kda"><span id="d-kda"></span><small id="d-extra"></small></div>
    </div>
    <div class="dbody">
      <div class="stats" id="d-stats"></div>
      <div class="right">
        <div>
          <div class="lbl">强化符文</div>
          <div class="augs" id="d-augs"></div>
        </div>
        <div>
          <div class="lbl">出装 · <span id="d-gold"></span></div>
          <div class="items" id="d-items"></div>
        </div>
        <div>
          <div class="lbl">召唤师技能</div>
          <div class="spells" id="d-spells"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <div id="foot-l"></div>
    <div id="foot-r"></div>
  </div>

</div>
</div>

const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const kk = n => n >= 1000 ? (n/1000).toFixed(1) + 'k' : String(n);
const champImg = cid => 'https://cdn.communitydragon.org/latest/champion/' + cid + '/square';
const itemImg = id => 'https://ddragon.leagueoflegends.com/cdn/16.21.1/img/item/' + id + '.png';

const P = D.players, META = D.meta, TM = D.teams.mine, TF = D.teams.foe;
const sideCN = s => s === 'mine' ? '我方' : '敌方';
const rank = side => Object.keys(P).filter(c => P[c].side === side).sort((a,b) => P[b].score - P[a].score);
const GOLD_RANK = {}; // 金币获得的全场名次，详情条用
Object.keys(P).sort((a,b) => P[b].gold - P[a].gold).forEach((c, i) => { GOLD_RANK[c] = i + 1; });

/* 三栏评价：敌我各算一套，绝不跨队混排 */
const VERDICT = {};
function pickVerdict(side){
  const g = Object.keys(P).filter(c => P[c].side === side);
  const carry = g.slice().sort((a,b) => P[b].score - P[a].score)[0];
  const worm  = g.slice().sort((a,b) =>
    (P[b].riskAxis - P[a].riskAxis) || (P[b].trig - P[a].trig) || (P[b].d - P[a].d))[0];
  // 不团队：输出不低、团队贡献最低，且不与前两项重复
  const rest = g.filter(c => c !== carry && c !== worm);
  const selfish = rest.filter(c => P[c].outAxis >= 60)
      .sort((a,b) => P[a].teamAxis - P[b].teamAxis)[0]
    || rest.sort((a,b) => P[a].teamAxis - P[b].teamAxis)[0];
  return { carry, worm, selfish };
}
VERDICT.mine = pickVerdict('mine');
VERDICT.foe  = pickVerdict('foe');

/* ── 头部 ── */
$('mid').textContent = fmt(META.length) + ' · 海克斯大乱斗 · ' + META.mode;
$('result').textContent = META.win ? '胜利' : '失败';
$('result').className = 'result' + (META.win ? '' : ' lose');
$('res').textContent = META.win ? '我方胜利' : '我方失败';
$('sub').innerHTML = '<b>' + TM.k + '</b> : <b>' + TF.k + '</b> 击杀 · 全场 <b>'
  + META.totalKills + '</b> 次阵亡 · 时长 <b>' + fmt(META.length) + '</b>';

const goldDiff = TM.gold - TF.gold;
$('kpis').innerHTML = [
  [TM.k + '/' + TM.d + '/' + TM.a, '全队 K / D / A', ''],
  [(goldDiff >= 0 ? '+' : '−') + (Math.abs(goldDiff)/1000).toFixed(1) + '<span class="s">k</span>',
   '金币差', goldDiff >= 0 ? 'pos' : 'neg'],
  [TM.tower + '<span class="s">:</span>' + TF.tower, '防御塔', ''],
].map(([v, l, cls]) =>
  '<div class="kpi"><div class="v ' + cls + '">' + v + '</div><div class="l">' + l + '</div></div>'
).join('');

$('foe-line').textContent = TF.tower + ' TOWER · ' + TF.k + ' KILL';
$('mine-line').textContent = TM.tower + ' TOWER · ' + TM.k + ' KILL';


/* ── 阵容 ── */
function slotHTML(cn, i){
  const p = P[cn];
  const stamp = VERDICT[p.side].worm === cn;
  const mvp = VERDICT[p.side].carry === cn;
  return '<div class="slot" data-c="' + cn + '">'
    + '<div class="top"><span class="idx">' + String(i+1).padStart(2,'0') + '</span>'
      + '<span class="sc' + (p.score < 0 ? ' na' : '') + (mvp ? ' mvp' : '')
      + '">' + p.score.toFixed(0) + '</span></div>'
    + '<div class="avawrap"><div class="ava"><img src="' + champImg(p.cid) + '" alt=""></div>'
      + (stamp ? '<span class="stamp">蛆</span>' : '') + '</div>'
    + '<div class="nm">' + p.name + '</div>'
    + '<div class="kd">' + p.k + ' / <span class="d' + (p.d >= 12 ? ' hot' : '') + '">'
      + p.d + '</span> / ' + p.a + '</div>'
    + '<div class="rails">'
    +   '<i style="--w:' + p.outAxis + '%;--c:var(--rail)"></i>'
    +   '<i style="--w:' + p.teamAxis + '%;--c:var(--rail-2)"></i>'
    +   '<i style="--w:' + p.riskAxis + '%;--c:var(--danger)"></i>'
    + '</div></div>';
}
$('foe-slots').innerHTML = rank('foe').map(slotHTML).join('');
$('mine-slots').innerHTML = rank('mine').map(slotHTML).join('');

/* ── 时间轴：崩盘刻痕 + 目标 ── */
(function(){
  const ax = $('axis'), L = META.length;
  for (let m = 1; m * 60 < L; m++){
    const d = document.createElement('div');
    d.className = 'tick'; d.style.left = (m*60/L*100) + '%';
    ax.appendChild(d);
  }
  D.episodes.forEach(e => {
    const p = P[e.by];
    const d = document.createElement('div');
    d.className = 'ep ' + e.side;
    d.style.left = (e.t/L*100) + '%';
    d.innerHTML = '<span class="lb">' + e.ours + '</span>';
    d.title = fmt(e.t) + ' · ' + p.name + '（' + p.champ + '）先倒，之后'
      + sideCN(e.side) + '再死 ' + e.ours + ' 人，对方死 ' + e.theirs + ' 人';
    ax.appendChild(d);
  });
  D.objectives.forEach(([t, name, who]) => {
    const d = document.createElement('div');
    d.className = 'ob' + (name === 'InhibKilled' ? ' inhib' : name === 'Ace' ? ' ace' : '');
    d.style.left = (t/L*100) + '%';
    d.title = fmt(t) + ' · ' + (name === 'TurretKilled' ? '塔被推'
      : name === 'InhibKilled' ? '水晶被破' : '团灭') + ' · ' + who;
    ax.appendChild(d);
  });
})();

/* ── 结论：敌我各一组，同一套判定口径 ── */
let pretty = false;
function renderVerdicts(){
  const TT = pretty ? ['全场最累', '灵魂人物', '独狼艺术家'] : ['尽力 C', '蛆', '不团队'];
  $('verdicts').innerHTML = '<div class="vhead"><span>本局评价</span>'
    + '<i>敌我各一组 · 只针对这一局，不含历史战绩</i></div>'
    + ['mine', 'foe'].map(side => {
    const v = VERDICT[side], agg = side === 'mine' ? TM : TF;
    const c = P[v.carry], w = P[v.worm], f = P[v.selfish];
    const wEp = D.episodes.filter(e => e.by === v.worm).length;
    const allEp = D.episodes.filter(e => e.side === side).length;

    // 跨局只统计一件事：这个人在已记录的局里当了几次本队蛆
    const CAREER = D.career || null;
    const timesAsWorm = CAREER ? (CAREER.worm[w.puuid] || 1) : 0;
    const wormNote = CAREER
      ? '<i>' + (CAREER.games <= 1 ? '首次' : '第 ' + timesAsWorm + ' 次') + '</i>'
      : '';

    const cards = [
      { t: TT[0], p: c, cls: '',
        why: '综合分 <b>' + c.score.toFixed(0) + '</b> 队内第一（输出轨 <b>' + c.outAxis
           + '</b> · 团队轨 <b>' + c.teamAxis + '</b>）。<br>'
           + (c.teamAxis >= c.outAxis
               ? '自我减伤 <b>' + c.mit.toLocaleString() + '</b>、治疗+护盾 <b>'
                 + kk(c.heal + c.shield) + '</b>、承伤 <b>' + c.takenShare + '%</b>。'
               : '伤害 <b>' + c.dmg.toLocaleString() + '</b>、<b>' + c.k + '</b> 杀占队内 <b>'
                 + c.killShare + '%</b>。') },
      { t: TT[1] + wormNote, p: w, cls: ' worm',
        why: '风险轨 <b>100</b>：本队 <b>' + allEp + '</b> 次崩盘里 <b>' + wEp
           + '</b> 次由他先倒。<br><b>' + w.d + '</b> 死、承伤 <b>' + w.takenShare
           + '%</b>、控制 <b>' + w.cc + '</b> 秒。' },
      { t: TT[2], p: f, cls: '',
        why: '伤害 <b>' + f.dmg.toLocaleString() + '</b>（输出轨 <b>' + f.outAxis
           + '</b>），团队轨只有 <b>' + f.teamAxis + '</b>。<br>承伤 <b>' + kk(f.taken)
           + '</b>、控制 <b>' + f.cc + '</b> 秒、治疗 <b>' + kk(f.heal) + '</b>。' },
    ];

    return '<div class="vgroup">'
      + '<div class="vlabel"><span class="side">' + sideCN(side) + '</span><span class="ln"></span>'
      + '<span class="sum">' + agg.k + ' 杀 · ' + agg.dmg.toLocaleString() + ' 伤害 · '
      + agg.taken.toLocaleString() + ' 承伤 · 塔 ' + agg.tower + '</span></div>'
      + '<div class="vgrid">'
      + cards.map(x => '<div class="vd' + x.cls + '"><div class="t">' + x.t + '</div>'
          + '<div class="n">' + x.p.name + '<em>' + x.p.champ + '</em></div>'
          + '<div class="why">' + x.why + '</div></div>').join('')
      + '</div></div>';
  }).join('');
}
renderVerdicts();


/* ── 崩盘记录 ── */
(function(){
  const eps = D.episodes.slice().sort((a,b) => a.t - b.t);
  $('ep-count').textContent = eps.length;

  $('ilist').innerHTML = eps.map(e => {
    const p = P[e.by];
    const hot = e.by === VERDICT.mine.worm;
    return '<div class="ir' + (hot ? ' crime' : '') + '">'
      + '<span class="tm">' + fmt(e.t) + '</span>'
      + '<span class="who"><b>' + p.name + '</b><span>' + p.champ + '</span>'
      + '<span class="sd">' + sideCN(e.side) + '</span></span>'
      + '<span class="cost">再死 ' + e.ours + ' · 对方 ' + e.theirs + '</span></div>';
  }).join('');

  const dist = $('dist'), L = META.length;
  const mx = Math.max.apply(null, eps.map(e => Math.max(e.ours, e.theirs)));
  eps.forEach(e => {
    const d = document.createElement('div');
    d.className = 'm' + (e.side === 'foe' ? ' foe' : '');
    d.style.left = (e.t/L*100) + '%';
    const h = Math.round(e.ours / mx * 88) + 'px';
    d.style.setProperty('--h', h);
    if (e.side === 'foe'){ d.style.height = h; d.style.top = '113px'; d.style.bottom = 'auto'; }
    d.title = fmt(e.t) + ' · ' + P[e.by].name + '（' + sideCN(e.side) + '）先倒 · 再死 ' + e.ours;
    dist.appendChild(d);
  });
  $('dist-ax').innerHTML = [0, Math.round(L/120), Math.round(L/60)]
    .map(m => '<span>' + m + 'm</span>').join('');
})();

/* ── 详情条 ── */
/* 柱长一律按「本队最高」归一，与旁边的「队内」百分比同一参照系 */
function teamMax(side){
  const g = Object.values(P).filter(p => p.side === side);
  const mx = f => Math.max.apply(null, g.map(f)) || 1;
  return { dmg: mx(p => p.dmg), taken: mx(p => p.taken), mit: mx(p => p.mit),
           heal: mx(p => p.heal + p.shield), cc: mx(p => p.cc), gold: mx(p => p.gold) };
}
const LV = { kPrismatic: 'p', kGold: 'g', kSilver: 's', kBronze: 's', kEventChoice: 's' };

function renderDetail(cn){
  const p = P[cn];
  $('d-img').src = champImg(p.cid);
  $('d-name').textContent = p.name;
  $('d-champ').textContent = p.champ + ' · ' + sideCN(p.side);
  $('d-kda').textContent = p.k + ' / ' + p.d + ' / ' + p.a;
  $('d-extra').textContent = '综合 ' + p.score.toFixed(0) + ' · 阵亡累计 ' + p.dead + 's';

  const MX = teamMax(p.side);
  const rows = [
    ['伤害', p.dmg, MX.dmg, 'var(--rail)', p.dmgShare + '% 队内'],
    ['承伤', p.taken, MX.taken, 'var(--rail-2)', p.takenShare + '% 队内'],
    ['自我减伤', p.mit, MX.mit, 'var(--rail-2)', '每次阵亡 ' + Math.round(p.mit / Math.max(1, p.d))],
    ['治疗+护盾', p.heal + p.shield, MX.heal, 'var(--rail-2)', p.healShare + '% 队内'],
    ['控制', p.cc, MX.cc, 'var(--rail)', '秒 · ' + p.ccShare + '% 队内'],
    ['金币 获得', p.gold, MX.gold, 'var(--gold)', '全场第 ' + GOLD_RANK[cn]],
  ];
  $('d-stats').innerHTML = rows.map(([label, v, mx, color, note]) =>
    '<div class="st"><div class="top"><span class="k">' + label + '</span>'
    + '<span class="v">' + v.toLocaleString() + (note ? '<small>' + note + '</small>' : '') + '</span></div>'
    + '<div class="bar"><i style="--w:' + Math.round(v/mx*100) + '%;--c:' + color + '"></i></div></div>'
  ).join('');

  $('d-augs').innerHTML = p.aug.map(a => {
    if (!a) return '<div class="aug s"><span>未记录</span></div>';
    return '<div class="aug ' + (LV[a.level] || 's') + '">'
      + (a.icon ? '<img src="' + a.icon + '" alt="">' : '') + '<span>' + a.name + '</span></div>';
  }).join('');

  $('d-gold').textContent = '花费 ' + kk(p.spent) + ' 金币';
  const pad = p.items.slice(0, 7);
  while (pad.length < 7) pad.push(null);
  $('d-items').innerHTML = pad.map(it => it
    ? '<img src="' + itemImg(it.id) + '" alt="" title="' + it.name + ' · ' + it.price + 'g">'
    : '<div class="emp"></div>').join('');

  $('d-spells').innerHTML = '<div><b>D</b>' + (p.spell1 || '—') + '</div>'
    + '<div><b>F</b>' + (p.spell2 || '—') + '</div>';
}

/* ── 交互 ── */
document.querySelectorAll('.slot').forEach(s => {
  s.addEventListener('click', () => {
    document.querySelectorAll('.slot').forEach(x => x.classList.remove('sel'));
    s.classList.add('sel');
    renderDetail(s.dataset.c);
  });
});

$('pretty').addEventListener('click', () => {
  pretty = !pretty;
  $('pretty').classList.toggle('on', pretty);
  $('indict-title').textContent = pretty ? '高光时刻' : '崩盘记录';
  renderVerdicts();
});

$('foot-l').textContent = 'gameId ' + META.gameId + ' · ' + META.mode + ' · queueId 2400';
const REC = D.career ? D.career.games : 0;
$('foot-r').innerHTML = '评价口径 <b>仅本局</b>'
  + (REC ? ' · 已记录 <b>' + REC + '</b> 局' : '')
  + ' · 数据源 <b>eog-stats-block</b> + <b>liveclientdata</b>';

/* 默认选中「尽力 C」那一位，让详情条和第一栏结论对得上 */
const first = VERDICT.mine.carry;
renderDetail(first);
document.querySelectorAll('.slot').forEach(s => {
  if (s.dataset.c === first && s.parentElement.id === 'mine-slots') s.classList.add('sel');
});
</script>
